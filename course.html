<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal - My Courses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- ================= STUDENT LOGIN SCREEN ================= -->
  <div id="student-login-screen" class="flex min-h-screen items-center justify-center bg-slate-900 px-4">
    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-white">Student Portal Sign In</h2>
        <p class="text-xs text-slate-400 mt-1">Access courses assigned to your college</p>
      </div>
      
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-lg"></div>
      
      <form id="student-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase">College Email Address</label>
          <input type="email" id="login-email" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="student@college.ac.in" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase">Password</label>
          <input type="password" id="login-password" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="••••••••" />
        </div>
        <button type="submit" id="login-btn" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition">Log In to Dashboard</button>
      </form>
    </div>
  </div>

  <!-- ================= MAIN DASHBOARD & COURSE CATALOG ================= -->
  <div id="student-dashboard" class="hidden flex-1 flex flex-col">
    <!-- Student Header & Profile Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 py-4 px-6">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">
            <span id="profile-avatar">S</span>
          </div>
          <div>
            <h1 id="profile-name" class="text-base font-bold text-white">Student Name</h1>
            <p id="profile-email" class="text-xs text-slate-400"></p>
          </div>
        </div>

        <!-- Student Profile Badges -->
        <div class="flex items-center space-x-3">
          <span id="profile-college-badge" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded-full text-xs font-semibold">
            College: Loading...
          </span>
          <button id="logout-btn" class="px-3 py-1.5 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg text-xs font-semibold transition">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Course Grid Section -->
    <main class="max-w-7xl w-full mx-auto p-6 md:p-8 flex-1">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-white">Assigned College Courses</h2>
        <p class="text-xs text-slate-400">Select a course to start learning</p>
      </div>

      <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Course Cards Injected Dynamically -->
      </div>
    </main>
  </div>

  <!-- ================= FULL PAGE COURSE DISPLAY PAGE ================= -->
  <div id="full-page-course-view" class="hidden fixed inset-0 min-h-screen bg-slate-950 text-slate-100 flex flex-col z-50 overflow-y-auto">
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center sticky top-0 z-40">
      <button onclick="closeFullPageCourseView()" class="inline-flex items-center text-indigo-400 hover:text-white font-semibold text-sm transition">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Course Catalog
      </button>
      <h2 id="page-course-header-title" class="text-lg font-bold text-white truncate max-w-md"></h2>
      <span class="text-xs bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full font-semibold">Full HD Streaming</span>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2 space-y-6">
        <!-- Video Box -->
        <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-2xl space-y-4">
          <div id="video-player-box" class="relative aspect-video rounded-xl overflow-hidden bg-black flex items-center justify-center">
            <!-- Dynamic Player Injected Here -->
          </div>

          <div class="flex flex-wrap items-center justify-between gap-4 pt-2 text-sm border-t border-slate-800">
            <div class="flex items-center space-x-2" id="speed-controls-bar">
              <span class="text-slate-400 text-xs font-medium">Speed:</span>
              <button onclick="setVideoSpeed(0.75)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-slate-200">0.75x</button>
              <button onclick="setVideoSpeed(1.0)" class="px-2.5 py-1 bg-indigo-600 rounded text-xs font-semibold text-white">1.0x</button>
              <button onclick="setVideoSpeed(1.25)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-slate-200">1.25x</button>
              <button onclick="setVideoSpeed(1.5)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-slate-200">1.5x</button>
              <button onclick="setVideoSpeed(2.0)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs font-semibold text-slate-200">2.0x</button>
            </div>

            <div id="page-pdf-container">
              <a id="page-pdf-btn" href="#" target="_blank" class="inline-flex items-center px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold transition">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Download PDF Notes
              </a>
            </div>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
          <h2 id="page-active-module-title" class="text-xl font-bold text-indigo-400"></h2>
          <hr class="border-slate-800" />
          <h3 class="text-base font-semibold text-slate-200">Syllabus & Details</h3>
          <p id="page-course-desc" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>

      <div class="space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 sticky top-24">
          <h3 class="text-base font-bold text-white flex items-center justify-between">
            <span>Video Modules</span>
            <span id="page-module-count" class="text-xs bg-indigo-600/40 text-indigo-300 px-2.5 py-0.5 rounded-full"></span>
          </h3>
          <div id="page-playlist-container" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase Module Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCga9Taij7xAz1UtfnVGaHiEGfYc9N4ROU",
      authDomain: "lms-portal-careergraspp.firebaseapp.com",
      projectId: "lms-portal-careergraspp",
      storageBucket: "lms-portal-careergraspp.firebasestorage.app",
      messagingSenderId: "175460420645",
      appId: "1:175460420645:web:9fe41933926ccb1b4543cc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('student-login-screen');
    const studentDashboard = document.getElementById('student-dashboard');
    const fullPageCourseView = document.getElementById('full-page-course-view');
    const authError = document.getElementById('auth-error');

    let currentStudentData = null;
    let currentCoursesCache = {};
    let activeCourseModules = [];

    // 1. AUTH STATE MONITORING & MULTI-TENANT ISOLATION
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            currentStudentData = userDoc.data();
            
            // Display Profile Details
            document.getElementById('profile-name').textContent = currentStudentData.name || user.email.split('@')[0];
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-avatar').textContent = (currentStudentData.name || user.email)[0].toUpperCase();
            document.getElementById('profile-college-badge').textContent = `College ID: ${currentStudentData.collegeId || 'General'}`;

            loginScreen.classList.add('hidden');
            studentDashboard.classList.remove('hidden');

            loadAssignedCourses(currentStudentData.collegeId);
          } else {
            showError("Student profile doc missing in database.");
            await signOut(auth);
          }
        } catch (err) {
          showError("Profile verification error: " + err.message);
        }
      } else {
        studentDashboard.classList.add('hidden');
        fullPageCourseView.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    // 2. STUDENT LOGIN HANDLER
    document.getElementById('student-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(
          auth, 
          document.getElementById('login-email').value, 
          document.getElementById('login-password').value
        );
      } catch (err) {
        showError("Invalid credentials: " + err.message);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    // 3. LOAD COURSES (FILTERED BY STUDENT'S COLLEGE ID)
    function loadAssignedCourses(studentCollegeId) {
      onSnapshot(collection(db, "courses"), (snapshot) => {
        const grid = document.getElementById('course-grid');
        grid.innerHTML = "";
        currentCoursesCache = {};

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;

          // Multi-tenant Filter: Display course if targetColleges includes student's collegeId or 'all'
          const targetColleges = data.targetColleges || ['all'];
          const isAssigned = targetColleges.includes('all') || targetColleges.includes(studentCollegeId);

          if (isAssigned) {
            currentCoursesCache[docId] = data;
            const defaultImg = "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=600&auto=format&fit=crop";
            const partCount = data.modules ? data.modules.length : (data.videoUrl ? 1 : 0);

            grid.innerHTML += `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-indigo-500/50 transition">
                <div>
                  <div class="h-44 w-full bg-slate-800 relative overflow-hidden">
                    <img src="${data.imageUrl || defaultImg}" alt="${data.title}" class="w-full h-full object-cover" />
                    <span class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] px-2.5 py-1 rounded-full font-bold shadow">${partCount} Lessons</span>
                  </div>
                  <div class="p-5">
                    <h3 class="font-bold text-lg text-white mb-2">${data.title}</h3>
                    <p class="text-xs text-slate-400 line-clamp-3">${data.description}</p>
                  </div>
                </div>
                <div class="p-5 pt-0">
                  <button onclick="openFullPageCourseView('${docId}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 px-4 rounded-xl transition flex items-center justify-center">
                    <span>Start Learning</span>
                    <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              </div>
            `;
          }
        });
      });
    }

    // 4. SMART VIDEO ENGINE
    function renderVideoPlayer(url) {
      const box = document.getElementById('video-player-box');
      const speedBar = document.getElementById('speed-controls-bar');
      if (!url) {
        box.innerHTML = `<div class="text-slate-500 text-sm">No video uploaded for this lesson.</div>`;
        return;
      }

      if (url.includes('drive.google.com')) {
        speedBar.classList.add('hidden');
        const driveIdMatch = url.match(/\/file\/d\/([^\/]+)/);
        if (driveIdMatch && driveIdMatch[1]) {
          box.innerHTML = `<iframe src="https://drive.google.com/file/d/${driveIdMatch[1]}/preview" class="w-full h-full rounded-xl border-0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
          return;
        }
      }

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        speedBar.classList.add('hidden');
        let ytId = url.includes('v=') ? url.split('v=')[1]?.split('&')[0] : url.split('youtu.be/')[1]?.split('?')[0];
        if (ytId) {
          box.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1" class="w-full h-full rounded-xl border-0" allowfullscreen></iframe>`;
          return;
        }
      }

      speedBar.classList.remove('hidden');
      box.innerHTML = `
        <video id="page-video-player" controls controlsList="nodownload" class="w-full h-full object-contain rounded-xl">
          <source src="${url}" type="video/mp4" />
        </video>
      `;
    }

    // 5. FULL PAGE VIEWER CONTROLS
    window.openFullPageCourseView = function(courseId) {
      const course = currentCoursesCache[courseId];
      if (!course) return;

      fullPageCourseView.classList.remove('hidden');
      document.getElementById('page-course-header-title').textContent = course.title;
      document.getElementById('page-course-desc').textContent = course.description;

      activeCourseModules = course.modules && course.modules.length > 0 ? course.modules : [
        { title: "Part 1: Lesson", videoUrl: course.videoUrl || "", pdfUrl: course.pdfUrl || "" }
      ];

      document.getElementById('page-module-count').textContent = `${activeCourseModules.length} Parts`;

      const playlistContainer = document.getElementById('page-playlist-container');
      playlistContainer.innerHTML = "";

      activeCourseModules.forEach((mod, idx) => {
        playlistContainer.innerHTML += `
          <button onclick="playModuleIndex(${idx})" id="playlist-item-${idx}" class="w-full text-left p-3 rounded-xl border border-slate-800 bg-slate-800/50 hover:bg-indigo-600/20 transition flex items-center justify-between group">
            <div class="flex items-center space-x-3 truncate">
              <span class="w-6 h-6 rounded-full bg-slate-700 text-indigo-300 text-xs font-bold flex items-center justify-center flex-shrink-0 group-hover:bg-indigo-600 group-hover:text-white">${idx + 1}</span>
              <span class="text-xs font-semibold text-slate-200 truncate group-hover:text-white">${mod.title}</span>
            </div>
          </button>
        `;
      });

      playModuleIndex(0);
    };

    window.playModuleIndex = function(idx) {
      const mod = activeCourseModules[idx];
      if (!mod) return;

      activeCourseModules.forEach((_, i) => {
        const item = document.getElementById(`playlist-item-${i}`);
        if (item) {
          if (i === idx) {
            item.classList.add('bg-indigo-600/30', 'border-indigo-500');
          } else {
            item.classList.remove('bg-indigo-600/30', 'border-indigo-500');
          }
        }
      });

      document.getElementById('page-active-module-title').textContent = mod.title;
      renderVideoPlayer(mod.videoUrl);

      const pdfBtn = document.getElementById('page-pdf-btn');
      if (mod.pdfUrl) {
        pdfBtn.href = mod.pdfUrl;
        document.getElementById('page-pdf-container').classList.remove('hidden');
      } else {
        document.getElementById('page-pdf-container').classList.add('hidden');
      }
    };

    window.closeFullPageCourseView = function() {
      document.getElementById('video-player-box').innerHTML = "";
      fullPageCourseView.classList.add('hidden');
    };

    window.setVideoSpeed = function(speed) {
      const videoPlayer = document.getElementById('page-video-player');
      if (videoPlayer) videoPlayer.playbackRate = speed;
    };
  </script>
</body>
</html>
