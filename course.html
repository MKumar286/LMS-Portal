<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Courses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <header class="bg-slate-900 text-white py-6 shadow-md">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-400">Course Catalog</h1>
      <span class="text-sm bg-slate-800 text-slate-300 px-3 py-1 rounded-full">Explore Lessons</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Cards render dynamically -->
    </div>
  </main>

  <!-- Course Content Modal -->
  <div id="course-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="text-xl font-bold text-gray-900"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>
      <p id="modal-desc" class="text-gray-600 text-sm"></p>
      <div id="modal-actions" class="flex flex-col sm:flex-row gap-3 pt-4"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const courseGrid = document.getElementById('course-grid');

    // Real-Time Listener
    const coursesQuery = query(collection(db, "courses"), orderBy("createdAt", "desc"));
    
    onSnapshot(coursesQuery, (snapshot) => {
      courseGrid.innerHTML = "";

      snapshot.forEach((doc) => {
        const course = doc.data();
        
        // Convert multi-line descriptions or commas into bullet points
        const pointsArray = course.description
          ? course.description.split('\n').filter(p => p.trim() !== '')
          : ["Comprehensive course content", "Practice exercises included"];

        const defaultImage = "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=600&auto=format&fit=crop";

        const cardHtml = `
          <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden flex flex-col justify-between hover:shadow-xl transition-shadow duration-300">
            <div>
              <!-- Course Image -->
              <div class="h-48 w-full bg-gray-200 overflow-hidden relative">
                <img src="${course.imageUrl || defaultImage}" alt="${course.title}" class="w-full h-full object-cover" />
                <span class="absolute top-3 right-3 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-md font-semibold shadow">Active</span>
              </div>

              <div class="p-6">
                <!-- Bold Title -->
                <h3 class="text-xl font-extrabold text-gray-900 mb-3">${course.title}</h3>

                <!-- Key Points List -->
                <ul class="space-y-2 mb-4">
                  ${pointsArray.map(point => `
                    <li class="flex items-start text-sm text-gray-600">
                      <svg class="w-4 h-4 text-emerald-500 mr-2 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                      </svg>
                      <span>${point}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>

            <!-- View Course Button -->
            <div class="p-6 pt-0">
              <button onclick="openModal('${course.title.replace(/'/g, "\\'")}', '${course.description.replace(/'/g, "\\'")}', '${course.videoUrl || ''}', '${course.pdfUrl || ''}')" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center">
                <span>View Course</span>
                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        `;

        courseGrid.innerHTML += cardHtml;
      });
    });

    // Modal Handlers
    window.openModal = function(title, desc, videoUrl, pdfUrl) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;

      const actionsDiv = document.getElementById('modal-actions');
      actionsDiv.innerHTML = "";

      if (videoUrl) {
        actionsDiv.innerHTML += `
          <a href="${videoUrl}" target="_blank" class="flex-1 bg-indigo-600 text-white text-center py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">Watch Video</a>
        `;
      }
      if (pdfUrl) {
        actionsDiv.innerHTML += `
          <a href="${pdfUrl}" target="_blank" class="flex-1 bg-red-600 text-white text-center py-2.5 rounded-lg font-semibold hover:bg-red-700 transition">View PDF Material</a>
        `;
      }

      document.getElementById('course-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('course-modal').classList.add('hidden');
    };
  </script>
</body>
</html>
