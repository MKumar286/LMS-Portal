<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; }
    .hidden { display: none; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>College Admin Portal</h1>

  <!-- 1. LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h3>Enter College Access Code</h3>
    <input type="text" id="adminCollegeCode" placeholder="Enter College Code (e.g., VNR2026)">
    <button id="viewStudentsBtn">View Enrolled Students</button>
  </div>

  <!-- 2. DASHBOARD SECTION -->
  <div id="dashboardSection" class="card hidden">
    <h2>Enrolled Students - College: <span id="displayCollegeCode" class="badge"></span></h2>
    <p>Total Registered Students: <strong id="studentCount">0</strong></p>

    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Email Address</th>
          <th>Registration Type</th>
          <th>Course Progress</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Student rows will be injected here by JavaScript -->
      </tbody>
    </table>
  </div>

  <script type="module" src="college-admin.js"></script>
</body>
</html>
