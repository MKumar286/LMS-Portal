<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS Super Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="login-screen" class="flex min-h-screen items-center justify-center bg-slate-900 px-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl">
      <h2 class="text-2xl font-bold text-center text-slate-900 mb-6">Super Admin Login</h2>
      <div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
      
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="login-email" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@domain.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="login-password" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••" />
        </div>
        <button type="submit" id="login-btn" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ================= DASHBOARD SCREEN ================= -->
  <div id="dashboard-screen" class="hidden flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-5">
      <div>
        <h1 class="text-2xl font-bold mb-8 text-indigo-400">LMS SuperAdmin</h1>
        <nav class="space-y-2">
          <button onclick="showSection('courses-section')" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium">Manage Courses</button>
          <button onclick="showSection('colleges-section')" class="w-full text-left py-2.5 px-4 rounded hover:bg-slate-800 transition font-medium">Manage Colleges</button>
        </nav>
      </div>

      <!-- User Profile & Sign Out -->
      <div class="border-t border-slate-700 pt-4">
        <p id="user-email-display" class="text-xs text-gray-400 truncate mb-2"></p>
        <button id="logout-btn" class="w-full py-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded text-sm transition font-medium">Log Out</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-8 overflow-y-auto">
      
      <!-- Manage Courses Section -->
      <section id="courses-section" class="space-y-6">
        <h2 class="text-3xl font-bold text-gray-800">Course Management</h2>
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h3 class="text-xl font-semibold mb-4 text-gray-800">Add New Course</h3>
          
          <form id="add-course-form" class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700">Course Title</label>
              <input type="text" id="course-title" required class="w-full mt-1 p-2 border border-gray-300 rounded-md" placeholder="e.g., Aptitude Masterclass" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Description</label>
              <textarea id="course-desc" required class="w-full mt-1 p-2 border border-gray-300 rounded-md" placeholder="Course details..."></textarea>
            </div>

            <!-- VIDEO SOURCE OPTION -->
            <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-3">
              <label class="block text-sm font-semibold text-gray-800">Video Lesson Source</label>
              <div class="flex items-center space-x-6 text-sm">
                <label class="inline-flex items-center cursor-pointer">
                  <input type="radio" name="video-source-type" value="file" checked onchange="toggleInputMode('video', 'file')" class="text-indigo-600 focus:ring-indigo-500" />
                  <span class="ml-2 text-gray-700 font-medium">Direct File Upload</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                  <input type="radio" name="video-source-type" value="url" onchange="toggleInputMode('video', 'url')" class="text-indigo-600 focus:ring-indigo-500" />
                  <span class="ml-2 text-gray-700 font-medium">External Link (YouTube / Drive)</span>
                </label>
              </div>

              <!-- Video Inputs -->
              <div id="video-file-container">
                <input type="file" id="course-video-file" accept="video/*" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm" />
              </div>
              <div id="video-url-container" class="hidden">
                <input type="url" id="course-video-url" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm" placeholder="https://www.youtube.com/watch?v=..." />
              </div>
            </div>

            <!-- PDF SOURCE OPTION -->
            <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-3">
              <label class="block text-sm font-semibold text-gray-800">PDF Document Source</label>
              <div class="flex items-center space-x-6 text-sm">
                <label class="inline-flex items-center cursor-pointer">
                  <input type="radio" name="pdf-source-type" value="file" checked onchange="toggleInputMode('pdf', 'file')" class="text-indigo-600 focus:ring-indigo-500" />
                  <span class="ml-2 text-gray-700 font-medium">Direct File Upload</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                  <input type="radio" name="pdf-source-type" value="url" onchange="toggleInputMode('pdf', 'url')" class="text-indigo-600 focus:ring-indigo-500" />
                  <span class="ml-2 text-gray-700 font-medium">External Link (Google Drive / Cloud)</span>
                </label>
              </div>

              <!-- PDF Inputs -->
              <div id="pdf-file-container">
                <input type="file" id="course-pdf-file" accept="application/pdf" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm" />
              </div>
              <div id="pdf-url-container" class="hidden">
                <input type="url" id="course-pdf-url" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm" placeholder="https://drive.google.com/file/d/..." />
              </div>
            </div>

            <!-- Status Indicator -->
            <div id="upload-status" class="hidden text-sm font-semibold text-indigo-600 animate-pulse">
              Processing & uploading files... Please do not refresh.
            </div>

            <button type="submit" id="submit-btn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-md hover:bg-indigo-700 transition font-medium">Publish Course</button>
          </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h3 class="text-xl font-semibold mb-4 text-gray-800">Published Courses</h3>
          <div id="course-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </section>

      <!-- Manage Colleges Section -->
      <section id="colleges-section" class="space-y-6 hidden">
        <h2 class="text-3xl font-bold text-gray-800">College Onboarding</h2>
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h3 class="text-xl font-semibold mb-4 text-gray-800">Register New College</h3>
          <form id="add-college-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">College Code / ID (Unique)</label>
              <input type="text" id="college-id" required class="w-full mt-1 p-2 border border-gray-300 rounded-md" placeholder="e.g., jntu_hyd" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">College Full Name</label>
              <input type="text" id="college-name" required class="w-full mt-1 p-2 border border-gray-300 rounded-md" placeholder="e.g., JNTU Hyderabad" />
            </div>
            <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-md hover:bg-emerald-700">Register College</button>
          </form>
        </div>
      </section>

    </main>
  </div>

  <!-- Firebase Script Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      setDoc, 
      doc, 
      getDoc,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytesResumable, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 1. YOUR FIREBASE CONFIGURATION (Paste keys from Firebase Console)
     const firebaseConfig = {
      apiKey: "AIzaSyCga9Taij7xAz1UtfnVGaHiEGfYc9N4ROU",
      authDomain: "lms-portal-careergraspp.firebaseapp.com",
      projectId: "lms-portal-careergraspp",
      storageBucket: "lms-portal-careergraspp.firebasestorage.app",
      messagingSenderId: "175460420645",
      appId: "1:175460420645:web:9fe41933926ccb1b4543cc"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const authError = document.getElementById('auth-error');
    const userEmailDisplay = document.getElementById('user-email-display');

    // 2. EXPOSE GLOBAL TOGGLE FUNCTIONS
    window.showSection = function(sectionId) {
      document.getElementById('courses-section').classList.add('hidden');
      document.getElementById('colleges-section').classList.add('hidden');
      document.getElementById(sectionId).classList.remove('hidden');
    };

    window.toggleInputMode = function(type, mode) {
      const fileContainer = document.getElementById(`${type}-file-container`);
      const urlContainer = document.getElementById(`${type}-url-container`);

      if (mode === 'file') {
        fileContainer.classList.remove('hidden');
        urlContainer.classList.add('hidden');
      } else {
        fileContainer.classList.add('hidden');
        urlContainer.classList.remove('hidden');
      }
    };

    // 3. AUTH STATE LISTENER (SUPER ADMIN GUARD)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userDoc = await getDoc(userDocRef);

          if (userDoc.exists() && userDoc.data().role === "super_admin") {
            loginScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            userEmailDisplay.textContent = user.email;
            loadCourses();
          } else {
            await signOut(auth);
            showError("Access Denied: You do not have Super Admin permissions.");
          }
        } catch (err) {
          showError("Authorization check failed: " + err.message);
        }
      } else {
        dashboardScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    // 4. LOGIN HANDLER
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        showError("Invalid credentials: " + error.message);
      }
    });

    // 5. LOGOUT HANDLER
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth);
    });

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    // 6. HELPER FUNCTION TO UPLOAD FILE TO STORAGE
    async function uploadFileToStorage(file, folderPath) {
      if (!file) return "";
      const fileRef = ref(storage, `${folderPath}/${Date.now()}_${file.name}`);
      const uploadTask = await uploadBytesResumable(fileRef, file);
      return await getDownloadURL(uploadTask.ref);
    }

    // 7. COURSE FORM SUBMISSION (FILE OR URL DUAL MODE)
    const courseForm = document.getElementById('add-course-form');
    courseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const uploadStatus = document.getElementById('upload-status');
      
      const videoMode = document.querySelector('input[name="video-source-type"]:checked').value;
      const pdfMode = document.querySelector('input[name="pdf-source-type"]:checked').value;

      try {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50');
        uploadStatus.classList.remove('hidden');

        let finalVideoUrl = "";
        let finalPdfUrl = "";

        // Video Processing
        if (videoMode === 'file') {
          const file = document.getElementById('course-video-file').files[0];
          if (file) {
            finalVideoUrl = await uploadFileToStorage(file, "courses/videos");
          }
        } else {
          finalVideoUrl = document.getElementById('course-video-url').value;
        }

        // PDF Processing
        if (pdfMode === 'file') {
          const file = document.getElementById('course-pdf-file').files[0];
          if (file) {
            finalPdfUrl = await uploadFileToStorage(file, "courses/pdfs");
          }
        } else {
          finalPdfUrl = document.getElementById('course-pdf-url').value;
        }

        // Save metadata in Firestore
        await addDoc(collection(db, "courses"), {
          title: document.getElementById('course-title').value,
          description: document.getElementById('course-desc').value,
          videoUrl: finalVideoUrl,
          pdfUrl: finalPdfUrl,
          videoSource: videoMode,
          pdfSource: pdfMode,
          createdAt: new Date()
        });

        alert("Course published successfully!");
        courseForm.reset();
        window.toggleInputMode('video', 'file');
        window.toggleInputMode('pdf', 'file');

      } catch (error) {
        alert("Error publishing course: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
        uploadStatus.classList.add('hidden');
      }
    });

    // 8. REGISTER COLLEGE HANDLER
    const collegeForm = document.getElementById('add-college-form');
    collegeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const collegeId = document.getElementById('college-id').value.toLowerCase().trim();
      const collegeName = document.getElementById('college-name').value;
      try {
        await setDoc(doc(db, "colleges", collegeId), {
          name: collegeName,
          createdAt: new Date()
        });
        alert("College registered successfully!");
        collegeForm.reset();
      } catch (error) {
        alert("Error registering college: " + error.message);
      }
    });

    // 9. LIVE COURSES REALTIME LISTENER
    function loadCourses() {
      onSnapshot(collection(db, "courses"), (snapshot) => {
        const container = document.getElementById('course-list');
        container.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          container.innerHTML += `
            <div class="border border-gray-200 p-4 rounded-lg bg-gray-50">
              <h4 class="font-bold text-lg text-indigo-900">${data.title}</h4>
              <p class="text-sm text-gray-600 mb-2">${data.description}</p>
              <div class="flex space-x-2 text-xs">
                ${data.videoUrl ? `<a href="${data.videoUrl}" target="_blank" class="text-blue-600 font-semibold underline">Watch Video (${data.videoSource || 'link'})</a>` : ''}
                ${data.pdfUrl ? `<a href="${data.pdfUrl}" target="_blank" class="text-red-600 font-semibold underline">View PDF (${data.pdfSource || 'link'})</a>` : ''}
              </div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
