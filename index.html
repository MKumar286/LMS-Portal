<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Superadmin Portal - Course Manager</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #1a73e8; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #1557b0; }
    .btn-secondary { background: #34a853; }
    .quiz-question { background: #f8f9fa; border: 1px dashed #ccc; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>

<div class="container">
  <h1>Superadmin Portal</h1>

  <!-- 1. CREATE NEW COURSE -->
  <div class="card">
    <h2>1. Create a New Course</h2>
    <div class="form-group">
      <label>Course Title</label>
      <input type="text" id="courseTitle" placeholder="e.g., Aptitude & Reasoning Masterclass">
    </div>
    <div class="form-group">
      <label>Course Description</label>
      <textarea id="courseDesc" rows="2" placeholder="Brief details about the course..."></textarea>
    </div>
    <button class="btn" id="createCourseBtn">Create Course</button>
  </div>

  <!-- 2. ADD CONTENT TO COURSE -->
  <div class="card">
    <h2>2. Upload Content (Video / PDF / Quiz / Test)</h2>
    
    <div class="form-group">
      <label>Select Target Course</label>
      <select id="courseSelect">
        <option value="">-- Loading Courses --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Content Type</label>
      <select id="contentType">
        <option value="video">Video Lesson (YouTube / Drive Link)</option>
        <option value="pdf">PDF Resource (Document Link)</option>
        <option value="quiz">Interactive Quiz / Test</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title of Content / Lesson</label>
      <input type="text" id="contentTitle" placeholder="e.g., Chapter 1: Time & Work">
    </div>

    <!-- Dynamic Section for Videos / PDFs -->
    <div id="mediaSection" class="form-group">
      <label>File URL / Embed Link</label>
      <input type="url" id="contentUrl" placeholder="https://...">
    </div>

    <!-- Dynamic Section for Quizzes & Tests -->
    <div id="quizSection" style="display: none;">
      <h3>Quiz Questions</h3>
      <div id="questionsContainer"></div>
      <button type="button" class="btn btn-secondary" id="addQuestionBtn" style="margin-bottom: 15px;">+ Add Question</button>
    </div>

    <button class="btn" id="publishContentBtn">Publish Content to Course</button>
  </div>

  <!-- 3. EXISTING COURSES OVERVIEW -->
  <div class="card">
    <h2>3. Live Courses Overview</h2>
    <table>
      <thead>
        <tr>
          <th>Course ID</th>
          <th>Title</th>
          <th>Total Modules</th>
        </tr>
      </thead>
      <tbody id="coursesTableBody"></tbody>
    </table>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
