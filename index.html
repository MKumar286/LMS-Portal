<!DOCTYPE html>
<html>
<head>
  <title>Course Portal Registration</title>
</head>
<body>
  <h2>Student Registration</h2>
  <input type="text" id="name" placeholder="Full Name"><br><br>
  <input type="email" id="email" placeholder="Email Address"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  
  <label>Registering through a College?</label>
  <input type="text" id="collegeCode" placeholder="Enter College Code (Optional)"><br><br>

  <button id="signupBtn">Register & Access Course</button>

  <script type="module" src="script.js"></script>
</body>
</html>
