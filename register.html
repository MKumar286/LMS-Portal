<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration & Enrollment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-white">Student Enrollment</h2>
      <p class="text-xs text-slate-400 mt-1">Complete your profile & payment to access courses</p>
    </div>

    <form id="registration-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase">Full Name</label>
        <input type="text" id="student-name" required class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Rahul Sharma" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase">Email Address</label>
        <input type="email" id="student-email" required class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="student@college.edu" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase">Password</label>
        <input type="password" id="student-password" minlength="6" required class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase">Select College</label>
        <select id="student-college" required class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Loading available colleges...</option>
        </select>
      </div>

      <!-- Payment Summary -->
      <div class="p-4 bg-indigo-950/40 border border-indigo-800/40 rounded-xl flex justify-between items-center text-sm">
        <span class="text-indigo-300 font-medium">Enrollment Fee</span>
        <span class="text-xl font-bold text-white">₹999</span>
      </div>

      <div id="status-msg" class="hidden text-xs text-indigo-400 font-medium animate-pulse text-center"></div>

      <button type="submit" id="pay-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition text-sm shadow-lg shadow-indigo-600/30">
        Pay ₹999 & Create Account
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCga9Taij7xAz1UtfnVGaHiEGfYc9N4ROU",
      authDomain: "lms-portal-careergraspp.firebaseapp.com",
      projectId: "lms-portal-careergraspp",
      storageBucket: "lms-portal-careergraspp.firebasestorage.app",
      messagingSenderId: "175460420645",
      appId: "1:175460420645:web:9fe41933926ccb1b4543cc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. Fetch Registered Colleges dynamically for selection
    async function loadColleges() {
      const select = document.getElementById('student-college');
      try {
        const querySnapshot = await getDocs(collection(db, "colleges"));
        select.innerHTML = '<option value="">-- Choose your College --</option>';
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          select.innerHTML += `<option value="${docSnap.id}">${data.name} (${docSnap.id})</option>`;
        });
      } catch (err) {
        select.innerHTML = '<option value="general">General Student Access</option>';
      }
    }
    loadColleges();

    // 2. Handle Form Submission & Payment Processing
    document.getElementById('registration-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('student-name').value.trim();
      const email = document.getElementById('student-email').value.trim();
      const password = document.getElementById('student-password').value;
      const collegeId = document.getElementById('student-college').value;
      const statusMsg = document.getElementById('status-msg');
      const payBtn = document.getElementById('pay-btn');

      if (!collegeId) {
        alert("Please select your college.");
        return;
      }

      // Razorpay Checkout Configuration
      const options = {
        "key": "YOUR_RAZORPAY_KEY_ID", // Replace with your test/live Razorpay Key ID
        "amount": 99900, // Amount in paise (99900 paise = ₹999)
        "currency": "INR",
        "name": "LMS Student Registration",
        "description": "Course Access Enrollment Fee",
        "prefill": {
          "name": name,
          "email": email
        },
        "theme": { "color": "#4F46E5" },
        "handler": async function (response) {
          try {
            payBtn.disabled = true;
            statusMsg.textContent = "Payment successful! Creating your student account...";
            statusMsg.classList.remove('hidden');

            // Step A: Create Firebase Auth User
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const uid = userCredential.user.uid;

            // Step B: Save Student Document in Firestore
            await setDoc(doc(db, "users", uid), {
              name: name,
              email: email,
              role: "student",
              collegeId: collegeId,
              paymentId: response.razorpay_payment_id || "TEST_PAYMENT",
              paymentStatus: "completed",
              createdAt: new Date()
            });

            alert("Account created successfully! Redirecting to your student dashboard...");
            window.location.href = "course.html";

          } catch (error) {
            console.error("Post-payment error:", error);
            alert("Account creation failed: " + error.message);
            payBtn.disabled = false;
            statusMsg.classList.add('hidden');
          }
        }
      };

      // Fallback for Demo/Testing without Live Razorpay Key
      if (options.key === "YOUR_RAZORPAY_KEY_ID") {
        const proceedTest = confirm("Razorpay Key ID is set to placeholder. Proceed with Test Payment simulation?");
        if (proceedTest) {
          options.handler({ razorpay_payment_id: "pay_test_" + Date.now() });
          return;
        }
      }

      const rzp = new Razorpay(options);
      rzp.open();
    });
  </script>
</body>
</html>
